services:
  api:
    build: .
    container_name: nutritionist_api
    ports:
      - "8002:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    container_name: nutritionist_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: